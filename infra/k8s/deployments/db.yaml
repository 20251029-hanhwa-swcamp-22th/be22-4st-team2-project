apiVersion: apps/v1
kind: Deployment
metadata:
  name: salesboost-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: salesboost-db
  template:
    metadata:
      labels:
        app: salesboost-db
    spec:
      containers:
        - name: mariadb
          image: mariadb:10.11
          ports:
            - containerPort: 3306
          env:
            - name: MARIADB_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_DATABASE
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: root-password
            # 전용 앱 유저: 백엔드가 root 대신 이 계정으로 접속
            - name: MARIADB_USER
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_USERNAME
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: password
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/mysql
            # init.sql: Pod 최초 기동 시 테이블 및 샘플 데이터 초기화
            - name: db-init-sql
              mountPath: /docker-entrypoint-initdb.d/init.sql
              subPath: init.sql
          readinessProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            exec:
              command: ["healthcheck.sh", "--connect"]
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: db-pvc
        - name: db-init-sql
          configMap:
            name: db-init-sql
---
apiVersion: v1
kind: Service
metadata:
  name: salesboost-db
spec:
  selector:
    app: salesboost-db
  ports:
    - protocol: TCP
      port: 3306
      targetPort: 3306
  type: ClusterIP
