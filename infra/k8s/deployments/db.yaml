apiVersion: apps/v1
kind: Deployment
metadata:
  name: salesboost-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: salesboost-db
  template:
    metadata:
      labels:
        app: salesboost-db
    spec:
      containers:
        - name: mariadb
          image: mariadb:10.11
          ports:
            - containerPort: 3306
          env:
            - name: MARIADB_DATABASE
              value: salesboost
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: password
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/mysql
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: salesboost-db
spec:
  selector:
    app: salesboost-db
  ports:
    - protocol: TCP
      port: 3306
      targetPort: 3306
  type: ClusterIP
