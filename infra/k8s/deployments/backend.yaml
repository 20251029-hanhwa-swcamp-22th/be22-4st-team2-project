apiVersion: apps/v1
kind: Deployment
metadata:
  name: salesboost-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: salesboost-backend
  template:
    metadata:
      labels:
        app: salesboost-backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8081"
    spec:
      # Graceful Shutdown: Spring BootÍ∞Ä ÏßÑÌñâ Ï§ëÏù∏ ?îÏ≤≠???ÑÎ£å???åÍπåÏßÄ ?ÄÍ∏?(20s + ?¨Ïú† 10s)
      terminationGracePeriodSeconds: 30
      containers:
        - name: salesboost-backend
          image: ckato9173/salesboost-backend:23
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
            - containerPort: 8081
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          env:
            - name: JAVA_OPTS
              value: "-XX:MaxRAMPercentage=75 -XX:InitialRAMPercentage=50"
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: datasource-url
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: password
            - name: APP_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: jwt-secret
            - name: APP_CORS_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: APP_CORS_ALLOWED_ORIGINS
            - name: LOGSTASH_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: LOGSTASH_HOST
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: SPRING_JPA_HIBERNATE_DDL_AUTO
          volumeMounts:
            - name: uploads-data
              mountPath: /app/uploads
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 90
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        # emptyDir: HPA ?§Ï??ºÏïÑ????Î™®Îì† ?∏Îìú?êÏÑú ÎßàÏö¥??Í∞Ä??(PVC RWO Ï∂©Îèå Î∞©Ï?)
        # ?†Ô∏è Ï£ºÏùò?¨Ìï≠:
        #   1) ?åÎìú ?¨Ïãú?????ÖÎ°ú???åÏùº ?†Ïã§??
        #   2) Î©Ä??Pod ?òÍ≤Ω?êÏÑú A Pod???ÖÎ°ú?úÎêú ?åÏùº??B Pod?êÏÑú Ï°∞Ìöå Î∂àÍ? (404 Î∞úÏÉù)
        # Í∑ºÎ≥∏ ?¥Í≤∞: AWS S3 / MinIO ?§Î∏å?ùÌä∏ ?§ÌÜ†Î¶¨Ï?Î°??åÏùº ?ÖÎ°ú??Î°úÏßÅ ?ÑÌôò
        # ?ÑÏãú ?¥Í≤∞: replicasÎ•?1Î°?Í≥†Ï†ï?òÍ±∞??AWS EFS(ReadWriteMany) Î≥ºÎ•® ?¨Ïö©
        - name: uploads-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: salesboost-backend
spec:
  selector:
    app: salesboost-backend
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
    - name: metrics
      protocol: TCP
      port: 8081
      targetPort: 8081
  type: ClusterIP
