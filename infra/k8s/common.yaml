---
# init.sql ConfigMap: K8s DB Pod 최초 기동 시 테이블 및 샘플 데이터 초기화에 사용
# 내용이 길어 별도 apply 방식 권장:
#   kubectl create configmap db-init-sql --from-file=init.sql=infra/docker/mariadb/init.sql
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-init-sql
  namespace: default
data:
  init.sql: |
    CREATE DATABASE IF NOT EXISTS salesboost CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
    USE salesboost;
    CREATE TABLE IF NOT EXISTS admin_user (
        id BIGINT NOT NULL AUTO_INCREMENT,
        username VARCHAR(100) NOT NULL,
        password VARCHAR(255) NOT NULL,
        role VARCHAR(50) NOT NULL,
        enabled TINYINT(1) NOT NULL DEFAULT 1,
        PRIMARY KEY (id),
        UNIQUE KEY uk_admin_user_username (username)
    ) ENGINE = InnoDB DEFAULT CHARSET = utf8mb4 COLLATE = utf8mb4_unicode_ci;
    CREATE TABLE IF NOT EXISTS inquiry (
        id BIGINT NOT NULL AUTO_INCREMENT,
        company_name VARCHAR(150) NOT NULL,
        contact_name VARCHAR(100) NOT NULL,
        email VARCHAR(150) NOT NULL,
        phone VARCHAR(30) NOT NULL,
        inquiry_type VARCHAR(30) NOT NULL,
        content VARCHAR(3000) NOT NULL,
        status VARCHAR(30) NOT NULL DEFAULT 'PENDING',
        admin_memo VARCHAR(3000),
        created_at DATETIME NOT NULL,
        updated_at DATETIME NOT NULL,
        PRIMARY KEY (id)
    ) ENGINE = InnoDB DEFAULT CHARSET = utf8mb4 COLLATE = utf8mb4_unicode_ci;
    CREATE TABLE IF NOT EXISTS portfolio (
        id BIGINT NOT NULL AUTO_INCREMENT,
        title VARCHAR(200) NOT NULL,
        description VARCHAR(3000) NOT NULL,
        client_name VARCHAR(150) NOT NULL,
        industry VARCHAR(100) NOT NULL,
        thumbnail_url VARCHAR(1000),
        visible TINYINT(1) NOT NULL DEFAULT 1,
        display_order INT NOT NULL DEFAULT 0,
        created_at DATETIME NOT NULL,
        updated_at DATETIME NOT NULL,
        PRIMARY KEY (id)
    ) ENGINE = InnoDB DEFAULT CHARSET = utf8mb4 COLLATE = utf8mb4_unicode_ci;
    CREATE TABLE IF NOT EXISTS portfolio_image (
        id BIGINT NOT NULL AUTO_INCREMENT,
        portfolio_id BIGINT NOT NULL,
        image_url VARCHAR(1000) NOT NULL,
        image_order INT NOT NULL DEFAULT 0,
        PRIMARY KEY (id),
        CONSTRAINT fk_portfolio_image_portfolio FOREIGN KEY (portfolio_id) REFERENCES portfolio (id) ON DELETE CASCADE
    ) ENGINE = InnoDB DEFAULT CHARSET = utf8mb4 COLLATE = utf8mb4_unicode_ci;
    INSERT IGNORE INTO admin_user (username, password, role, enabled)
    VALUES ('admin', '$2a$10$BeQwlhKlYhekHpFB1MAr..tz6.KbZH/o.1rpe1k/7nEV1FgQ8KvQm', 'ROLE_ADMIN', 1);

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
